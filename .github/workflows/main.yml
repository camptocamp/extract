name: Notify changes
on:
  push:
    tags:        
      - '*'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
    - name: Repository Dispatch
      uses: peter-evans/repository-dispatch@v3.0.0
      with:
        token: ${{ secrets.DISPATCH_TOKEN }}
        repository: https://api.github.com/repos/camptocamp/geoshop
        event-type: extract_new_tag
          
